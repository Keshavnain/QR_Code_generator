<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator- By Keshav Nain</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <div class="qr-header">
            <h1>Generate QR Code</h1>
            <input type="text" placeholder="Enter Text or URL" id="qr-text">
            <div>
            <label for="sizes"> Select Size: </label>
            <select id="sizes">
                <option value="100">100x100</option>
                <option value="200">200x200</option>
                <option value="300">300x300</option>
                <option value="400">400x400</option>
            </select>
            </div>
        </div>
        <div class="qr-body"></div>
        <div class="qr-footer">
           <a href="" class="genBtn" id="generateBtn"><i class="fa-solid fa-qrcode"></i>Generate</a>
           <a href="#" id="downloadBtn"><i class="fa-solid fa-download" class="downBtn" ></i></a>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
